# Free-first Hermes defaults. Existing live config is merged, never replaced wholesale.
model:
  default: openrouter/free
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
fallback_model:
  provider: openrouter
  model: google/gemini-2.5-flash-lite
provider_routing:
  sort: price
  data_collection: deny
  max_price: {prompt: 0.10, completion: 0.40, request: 0}
# Avoid paid default side-model calls for routine background work.
auxiliary:
  compression:
    provider: openrouter
    model: openrouter/free
    extra_body:
      provider:
        data_collection: deny
        max_price: {prompt: 0, completion: 0, request: 0}
  title_generation:
    provider: openrouter
    model: openrouter/free
    extra_body:
      provider:
        data_collection: deny
        max_price: {prompt: 0, completion: 0, request: 0}
  vision:
    provider: openrouter
    model: openrouter/free
    extra_body:
      provider:
        data_collection: deny
        max_price: {prompt: 0, completion: 0, request: 0}
