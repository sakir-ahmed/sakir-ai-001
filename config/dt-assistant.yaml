# =============================================================================
# dt-assistant settings — sales replies, approvals, follow-ups, publishing.
# After editing: sakir-ai restart dt-assistant
# =============================================================================

assistant_name: "Datatech BD Assistant"
company: "Datatech BD Ltd."
product: restora                    # default product for new leads
qdrant_collection: restora          # knowledge collection used for answers

# ---- Free-first routing; paid models only for complex work or fallback ----
# Free router selects currently available compatible free models automatically.
# Set allow_paid: false for free-only mode (outages produce a holding draft).
routing:
  free_first: true
  free_models: [openrouter/free]
  allow_paid: true
  paid_purposes: [reply_premium]     # existing complaint/proposal drafting path
  max_attempts: 2                   # no unbounded retry loops
  max_output_tokens: 500
  max_input_bytes: 24000
  data_collection: deny            # do not trade data policy for free capacity

# Price ceilings USD per 1M tokens; verified against OpenRouter 2026-10-31.
models:
  classify: {id: openrouter/free, price_in: 0, price_out: 0}
  reply: {id: openrouter/free, price_in: 0, price_out: 0}
  paid_fallback: {id: google/gemini-2.5-flash-lite, price_in: 0.10, price_out: 0.40}
  reply_premium: {id: deepseek/deepseek-v3.2, price_in: 0.26, price_out: 0.38}

# ---- Budget guard ----
budget:
  monthly_usd: 26                   # matches the OpenRouter 'sales' key limit
  alert_at_percent: 70              # Telegram warning to Sakir
  # At the limit, paid calls stop. Still-available free inference may continue.
  # If no eligible model succeeds, use a holding reply/draft for owner review.

# ---- Autonomy ----
autonomy:
  # Intents allowed to send WITHOUT approval. Start empty (everything is a
  # draft). After two clean weeks, add e.g. [faq, demo] — never price.
  auto_intents: []
  min_confidence: 0.85
  # Intents that can never be sent automatically, whatever is listed above.
  never_auto: [price, discount, complaint, order, legal, other]
  # Saved templates (knowledge/sales/templates.yaml) may be sent automatically
  # for the FAQ intent. Set false to send templates as drafts too.
  auto_send_templates: false

# ---- Meta rules ----
meta:
  graph_version: v25.0          # check yearly; Meta retires versions after ~2 years
  messenger_window_hours: 24        # Meta's standard messaging window
  draft_stale_hours: 23             # warn on drafts this old (window closing)
  comment_reply: public             # public reply under the comment
  hide_spam_comments: true

# ---- Follow-ups (inside the 24-hour window only) ----
followup:
  enabled: true
  check_every_minutes: 30
  after_silence_hours: 20           # lead went quiet this long after our reply
  stages: [interested, demo]        # only warm leads

# ---- Publisher ----
publisher:
  check_every_seconds: 60
  auto_platforms: [facebook, instagram]
  # Everything else (youtube, linkedin, tiktok, x) gets a ready-to-paste reminder.

# ---- Pause / holding replies ----
holding_reply:
  bn: "ধন্যবাদ! আমাদের টিম খুব শীঘ্রই আপনাকে উত্তর দেবে।"
  banglish: "Dhonnobad! Amader team khub shighroi apnake reply dibe."
  en: "Thank you! Our team will reply to you very shortly."

# ---- Data retention (privacy; keep in line with the published privacy policy) ----
# Runs once a day. Set a value to 0 to keep that data forever.
retention:
  messages_days: 365        # delete customer message text older than this
  approvals_days: 180       # delete decided drafts (sent/rejected/expired) older than this
  inactive_leads_days: 365  # delete leads still at stage new/lost with no message for this long

# ---- Schedules (Asia/Dhaka) ----
daily_metrics_time: "21:00"
