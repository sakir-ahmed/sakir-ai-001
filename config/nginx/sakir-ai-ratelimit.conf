# Sakir AI 001 — rate limit for public webhooks (http context).
# 10 requests/second per client IP; bursts are allowed per location.
# Rejections are logged at "warn" so fail2ban (nginx-limit-req jail) can ban abusers.
limit_req_zone $binary_remote_addr zone=sakir_webhook:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;
